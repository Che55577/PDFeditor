<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>LocalPDF</title>
  </head>

  <body>
    <main>
      <header>
        <h1>LocalPDF</h1>
        <p class="sub">檔案不離開這台電腦。處理結果在你存檔或關閉視窗後立即從暫存區抹除。</p>
        <p id="engine" class="engine"></p>
      </header>

      <nav class="tools" id="tools">
        <button type="button" data-tool="compress" class="active">壓縮</button>
        <button type="button" data-tool="merge">合併</button>
        <button type="button" data-tool="extract">擷取頁面</button>
        <button type="button" data-tool="remove">移除頁面</button>
        <button type="button" data-tool="rotate">旋轉</button>
        <button type="button" data-tool="crop">裁切</button>
        <button type="button" data-tool="split">分割</button>
        <button type="button" data-tool="tojpeg">轉成 JPG</button>
      </nav>

      <section id="drop" class="drop">
        <p>把 PDF 拖進來，或<button id="browse" class="link" type="button">選擇檔案</button></p>
      </section>

      <div class="options">
        <fieldset class="levels" data-for="compress">
          <legend class="sr-only">壓縮程度</legend>
          <label>
            <input type="radio" name="level" value="extreme" />
            <span>極限壓縮<em>檔案最小，畫質明顯下降</em></span>
          </label>
          <label>
            <input type="radio" name="level" value="recommended" checked />
            <span>建議壓縮<em>螢幕上幾乎看不出差異</em></span>
          </label>
          <label>
            <input type="radio" name="level" value="low" />
            <span>低度壓縮<em>保留列印品質</em></span>
          </label>
        </fieldset>

        <p class="hint" data-for="merge">依下方清單由上而下合併，可用 ↑ ↓ 調整順序。</p>

        <label class="field" data-for="extract">
          <span>保留哪些頁</span>
          <input id="extractPages" type="text" placeholder="例如 1-3, 7, 10-12" />
        </label>

        <label class="field" data-for="remove">
          <span>移除哪些頁</span>
          <input id="removePages" type="text" placeholder="例如 2, 5-6" />
        </label>

        <div class="rotate-opts" data-for="rotate">
          <label class="field">
            <span>哪些頁（留空代表全部）</span>
            <input id="rotatePages" type="text" placeholder="例如 1-3" />
          </label>
          <fieldset class="angles">
            <legend class="sr-only">旋轉角度</legend>
            <label><input type="radio" name="angle" value="90" checked /><span>順時針 90°</span></label>
            <label><input type="radio" name="angle" value="180" /><span>180°</span></label>
            <label><input type="radio" name="angle" value="270" /><span>逆時針 90°</span></label>
          </fieldset>
        </div>
        <div class="crop-opts" data-for="crop">
          <label class="field">
            <span>哪些頁（留空代表全部）</span>
            <input id="cropPages" type="text" placeholder="例如 1-3" />
          </label>
          <fieldset class="margins">
            <legend>四邊各往內裁切（公釐）</legend>
            <label><span>上</span><input id="cropTop" type="number" min="0" step="1" value="0" /></label>
            <label><span>下</span><input id="cropBottom" type="number" min="0" step="1" value="0" /></label>
            <label><span>左</span><input id="cropLeft" type="number" min="0" step="1" value="0" /></label>
            <label><span>右</span><input id="cropRight" type="number" min="0" step="1" value="0" /></label>
          </fieldset>
        </div>

        <label class="field" data-for="split">
          <span>每份幾頁</span>
          <input id="splitChunk" type="number" min="1" step="1" value="1" />
        </label>

        <label class="field" data-for="tojpeg">
          <span>解析度（DPI，20–600）</span>
          <input id="jpegDpi" type="number" min="20" max="600" step="10" value="150" />
        </label>
      </div>

      <div class="actions">
        <button id="run" type="button" disabled>執行</button>
        <button id="saveAll" type="button" class="ghost" hidden>全部儲存到資料夾…</button>
        <button id="clear" type="button" class="ghost" hidden>全部清除</button>
      </div>

      <p id="status" class="status" role="status"></p>
      <ul id="list" class="list"></ul>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
