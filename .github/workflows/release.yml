name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
          - platform: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Linux 系統相依套件
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ghostscript \
            qpdf \
            zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v4
        with:
          path: |
            vendor/ghostscript
            vendor/qpdf
          key: vendor-${{ runner.os }}-${{ runner.arch }}-gs10.07.1-qpdf12.4.2-v2

      - name: 安裝前端相依與同步 MuPDF
        run: npm ci

      - name: 取得 Ghostscript 與 qpdf
        run: npm run fetch:vendor

      - name: 打包 Tauri 安裝檔並發佈至 GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "LocalPDF v__VERSION__"
          releaseBody: |
            ### 📥 下載指南 (Download Guide)
            - **Windows (x64)**：下載 `LocalPDF_*_x64-setup.exe`
            - **macOS (Apple Silicon)**：下載 `LocalPDF_*_aarch64.dmg`
            - **Linux (x64)**：下載 `LocalPDF_*_amd64.deb` 或 `.AppImage`
            - **選用擴充包（PDF 轉 Word）**：下載對應平台的 `localpdf-pyext-*.zip`，開啟 LocalPDF 後點擊視窗下方 **「匯入擴充包 (.zip)」** 即可一鍵免權限啟用。
            - **供應鏈校驗**：所有安裝檔與擴充包之雜湊值均記錄於 `SHA256SUMS.txt`，並附帶 GitHub Sigstore 建置來源證明（可透過 `gh attestation verify <file> --repo Che55577/PDFeditor` 驗證）。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: 建置 Python 擴充包（pyext）
        run: python scripts/build-pyext.py

      - name: 封裝擴充包壓縮檔（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path vendor/pyext -DestinationPath "localpdf-pyext-Windows-${{ runner.arch }}.zip" -Force

      - name: 封裝擴充包壓縮檔（macOS / Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd vendor
          zip -ry "../localpdf-pyext-${{ runner.os }}-${{ runner.arch }}.zip" pyext

      - name: 附加擴充包至 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: localpdf-pyext-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上傳擴充包 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: localpdf-pyext-${{ runner.os }}-${{ runner.arch }}
          path: localpdf-pyext-*.zip

  finalize-release:
    needs: publish-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: 下載所有 Release 產物並產生 SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-assets
          gh release download "${GITHUB_REF_NAME}" -D dist-assets --repo "${GITHUB_REPOSITORY}"
          cd dist-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 產生 GitHub Sigstore 建置來源證明 (Build Provenance Attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist-assets/*"

      - name: 上傳 SHA256SUMS.txt 至 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist-assets/SHA256SUMS.txt --clobber --repo "${GITHUB_REPOSITORY}"
